name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings only)
        run: npx eslint src/ --ext .js --max-warnings 0 || true

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          DISCORD_TOKEN: dummy-token-for-ci
          DISCORD_CLIENT_ID: '123456789012345678'
          GUILD_ID: '1010226759817515018'
          ADMIN_ROLE_ID: '1529875116039606274'

      - name: Run full test pipeline
        run: npm test
        env:
          DISCORD_TOKEN: dummy-token-for-ci
          DISCORD_CLIENT_ID: '123456789012345678'
          GUILD_ID: '1010226759817515018'
          ADMIN_ROLE_ID: '1529875116039606274'

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API integration tests
        run: npm run test:api
        env:
          DISCORD_TOKEN: dummy-token-for-ci
          DISCORD_CLIENT_ID: '123456789012345678'
          GUILD_ID: '1010226759817515018'
          ADMIN_ROLE_ID: '1529875116039606274'

  e2e:
    name: E2E Smoke Tests (live)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run E2E tests against live site
        run: npm run test:e2e

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: cd dashboard && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
