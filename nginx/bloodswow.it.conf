# /etc/nginx/sites-available/bloodswow.it
# Reverse proxy per Bloods Hub Bot dashboard (porta 4567)
# con SSL Let's Encrypt

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bloodswow.it www.bloodswow.it;

    # Path verification per Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bloodswow.it www.bloodswow.it;

    # Certificati SSL (generati da certbot)
    ssl_certificate /etc/letsencrypt/live/bloodswow.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodswow.it/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy verso il bot (porta 4567)
    location / {
        proxy_pass http://127.0.0.1:4567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Cache asset statici Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4567;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt e sitemap.xml
    location = /robots.txt {
        proxy_pass http://127.0.0.1:4567;
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4567;
        access_log off;
        add_header Content-Type "application/xml";
    }
}
