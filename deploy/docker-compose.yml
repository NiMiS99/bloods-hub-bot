# ── Bloods Hub Bot — full stack (bot + MySQL) ──────────────────────────────
#  Usage:
#    1. Copy ../.env.example to ../.env and fill in real values.
#    2. docker compose --env-file ../.env up -d --build
#  The database data is persisted in the named volume `bloods_db`.
version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bloods_hub}
      MYSQL_USER: ${DB_USER:-bloods_bot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bloods_db:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
    volumes:
      - bot_logs:/app/logs

volumes:
  bloods_db:
  bot_logs:
